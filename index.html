<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدرر البهية — Ad-Durar Al-Bahiyyah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,18..72,400;0,18..72,500;0,18..72,600;1,18..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#122019;
    --ink-2:#182c22;
    --panel:#1c3226;
    --panel-line:#2c4a38;
    --gold:#b9924f;
    --gold-soft:#8f7442;
    --rubric:#9a4130;
    --parchment:#f2ead4;
    --parchment-2:#e9dfc2;
    --ink-text:#28211a;
    --soft-text:#e6ddc4;
    --muted-text:#a9b8ac;
    --font-ar:'Amiri', serif;
    --font-id:'Literata', serif;
    --font-ui:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--soft-text);
    font-family:var(--font-ui);
    overflow:hidden;
  }
  ::selection{background:var(--gold-soft);color:#fff;}

  /* ---------- LOGIN SCREEN ---------- */
  #loginScreen{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 15%, #1e3a2b 0%, var(--ink) 60%);
    z-index:100;
    padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:4px;
    padding:38px 34px 30px;
    position:relative;
    box-shadow:0 30px 60px rgba(0,0,0,.45);
  }
  .login-card::before{
    content:"";
    position:absolute;inset:8px;
    border:1px solid var(--gold-soft);
    border-radius:2px;
    pointer-events:none;
    opacity:.55;
  }
  .login-medallion{
    width:56px;height:56px;margin:0 auto 18px;
    display:block;
  }
  .login-card h1{
    font-family:var(--font-ar);
    font-size:1.9rem;
    text-align:center;
    color:var(--parchment);
    margin:0 0 2px;
    direction:rtl;
    font-weight:700;
  }
  .login-card p.sub{
    text-align:center;
    font-family:var(--font-id);
    font-size:.82rem;
    color:var(--muted-text);
    margin:0 0 26px;
    letter-spacing:.02em;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:.72rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted-text);margin-bottom:6px;
  }
  .field input{
    width:100%;padding:11px 12px;
    background:var(--ink-2);
    border:1px solid var(--panel-line);
    border-radius:3px;
    color:var(--parchment);
    font-family:var(--font-ui);
    font-size:.95rem;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--gold);}
  #loginBtn{
    width:100%;margin-top:10px;
    padding:12px;
    background:var(--gold);
    color:#1a1204;
    border:none;border-radius:3px;
    font-family:var(--font-ui);font-weight:600;font-size:.92rem;
    letter-spacing:.02em;
    cursor:pointer;
    transition:background .15s;
  }
  #loginBtn:hover{background:#cba55e;}
  #loginError{
    color:#e0938a;font-size:.8rem;text-align:center;
    margin-top:12px;min-height:1em;font-family:var(--font-ui);
  }
  .login-hint{
    margin-top:22px;padding-top:16px;
    border-top:1px dashed var(--panel-line);
    font-size:.72rem;color:var(--muted-text);text-align:center;
    line-height:1.7;
  }
  .login-hint b{color:var(--gold);}

  /* ---------- APP SHELL ---------- */
  #app{display:none;height:100vh;}
  #app.active{display:flex;flex-direction:column;}

  .topbar{
    height:56px;flex:0 0 auto;
    display:flex;align-items:center;
    gap:12px;
    padding:0 16px;
    background:var(--panel);
    border-bottom:1px solid var(--panel-line);
    z-index:10;
  }
  .topbar .brand{
    font-family:var(--font-ar);color:var(--parchment);
    font-size:1.15rem;font-weight:700;
    direction:rtl;
    white-space:nowrap;
  }
  .topbar .brand small{
    display:block;font-family:var(--font-ui);
    color:var(--muted-text);font-size:.62rem;font-weight:400;
    letter-spacing:.04em;text-transform:none;
    direction:ltr;
  }
  .topbar .spacer{flex:1;}
  #menuToggle{
    display:none;
    background:none;border:1px solid var(--panel-line);
    color:var(--soft-text);border-radius:3px;
    width:38px;height:38px;cursor:pointer;font-size:1.1rem;
  }

  .main-row{flex:1;display:flex;min-height:0;}

  /* content area */
  #content{
    flex:1;min-width:0;
    overflow-y:auto;
    background:var(--parchment);
    color:var(--ink-text);
  }
  .content-inner{
    max-width:820px;margin:0 auto;
    padding:34px 40px 90px;
  }

  .book-header{margin-bottom:22px;}
  .book-eyebrow{
    font-family:var(--font-ui);font-size:.7rem;
    letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold-soft);margin-bottom:6px;
  }
  .book-title-ar{
    font-family:var(--font-ar);font-size:2.1rem;font-weight:700;
    direction:rtl;color:var(--ink-text);margin:0 0 4px;
  }
  .book-title-id{
    font-family:var(--font-id);font-style:italic;
    color:#6b5c3e;font-size:1rem;margin:0;
  }

  /* audio player */
  .player{
    margin:22px 0 30px;
    background:#fff;
    border:1px solid var(--parchment-2);
    border-radius:6px;
    padding:14px 16px;
    box-shadow:0 2px 10px rgba(40,33,26,.06);
  }
  .player .player-label{
    font-size:.72rem;color:#8a7a55;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-ui);
  }
  .player audio{width:100%;height:36px;}
  .player .src-link{color:#8a7a55;text-decoration:none;border-bottom:1px dotted #8a7a55;}
  .player .src-link:hover{color:var(--rubric);}

  /* section roundel marker (signature element) */
  .section-block{margin:34px 0;}
  .section-marker{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .roundel{flex:0 0 auto;width:30px;height:30px;}
  .section-titles{flex:1;min-width:0;}
  .section-title-ar{
    font-family:var(--font-ar);font-size:1.35rem;color:var(--rubric);
    direction:rtl;font-weight:700;line-height:1.3;
  }
  .section-title-id{
    font-family:var(--font-id);font-size:.85rem;color:#8a7a55;font-style:italic;
  }
  .section-rule{
    height:1px;background:linear-gradient(to left, var(--gold-soft), transparent);
    margin-top:10px;
  }

  .para{
    margin:0 0 22px;
    padding-inline-start:2px;
  }
  .para-ar{
    font-family:var(--font-ar);font-size:1.5rem;line-height:2.15;
    direction:rtl;text-align:right;color:var(--ink-text);
    margin-bottom:8px;
  }
  .para-id{
    font-family:var(--font-id);font-size:.98rem;line-height:1.75;
    color:#4a4131;
    padding-inline-start:14px;
    border-inline-start:2px solid var(--parchment-2);
  }

  .empty-state{
    margin-top:20px;padding:26px 24px;
    border:1px dashed #cabe98;border-radius:6px;
    background:#f9f4e6;
    text-align:center;
  }
  .empty-state .icon{font-size:1.6rem;margin-bottom:8px;}
  .empty-state h3{
    margin:0 0 6px;font-family:var(--font-ui);font-size:.95rem;color:#5c4f33;
  }
  .empty-state p{
    margin:0;font-family:var(--font-id);font-size:.88rem;color:#7a6c4c;
    max-width:440px;margin:0 auto;line-height:1.6;
  }
  .empty-state a{color:var(--rubric);text-decoration:none;border-bottom:1px dotted var(--rubric);}

  /* ---------- SIDEBAR (right) ---------- */
  #sidebar{
    flex:0 0 300px;width:300px;
    background:var(--panel);
    border-left:1px solid var(--panel-line);
    overflow-y:auto;
    order:2;
  }
  .sidebar-search{
    position:sticky;top:0;
    background:var(--panel);
    padding:14px 14px 10px;
    border-bottom:1px solid var(--panel-line);
    z-index:2;
  }
  .sidebar-search input{
    width:100%;padding:9px 10px;
    background:var(--ink-2);border:1px solid var(--panel-line);
    border-radius:3px;color:var(--soft-text);font-family:var(--font-ui);
    font-size:.85rem;outline:none;
  }
  .sidebar-search input:focus{border-color:var(--gold);}
  ul.book-list{list-style:none;margin:0;padding:6px 8px 24px;}
  ul.book-list li{margin-bottom:2px;}
  .book-link{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:right;
    background:none;border:none;cursor:pointer;
    padding:9px 10px;border-radius:4px;
    color:var(--muted-text);
    font-family:var(--font-ui);font-size:.85rem;
    transition:background .12s, color .12s;
  }
  .book-link:hover{background:rgba(185,146,79,.12);color:var(--soft-text);}
  .book-link.active{
    background:rgba(185,146,79,.18);
    color:var(--parchment);
  }
  .book-num{
    flex:0 0 auto;
    width:26px;height:26px;border-radius:50%;
    border:1px solid var(--panel-line);
    display:flex;align-items:center;justify-content:center;
    font-size:.68rem;color:var(--gold-soft);
  }
  .book-link.active .book-num{border-color:var(--gold);color:var(--gold);}
  .book-names{flex:1;min-width:0;text-align:left;}
  .book-name-ar{
    font-family:var(--font-ar);font-size:.95rem;direction:rtl;text-align:right;
    display:block;line-height:1.3;
  }
  .book-name-id{
    display:block;font-size:.68rem;color:var(--muted-text);
    margin-top:1px;
  }

  #sidebarBackdrop{display:none;}

  @media (max-width: 860px){
    #menuToggle{display:flex;align-items:center;justify-content:center;}
    #sidebar{
      position:fixed;top:56px;right:0;bottom:0;
      transform:translateX(100%);
      transition:transform .22s ease;
      z-index:40;
      box-shadow:-10px 0 30px rgba(0,0,0,.4);
    }
    #sidebar.open{transform:translateX(0);}
    #sidebarBackdrop.open{
      display:block;position:fixed;inset:56px 0 0 0;
      background:rgba(0,0,0,.4);z-index:35;
    }
    .content-inner{padding:24px 18px 70px;}
    .book-title-ar{font-size:1.7rem;}
    .para-ar{font-size:1.3rem;}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <svg class="login-medallion" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="29" fill="none" stroke="#b9924f" stroke-width="1.4"/>
      <circle cx="32" cy="32" r="22" fill="none" stroke="#b9924f" stroke-width="1"/>
      <g stroke="#b9924f" stroke-width="1">
        <path d="M32 3 L32 61 M3 32 L61 32" opacity=".35"/>
      </g>
      <circle cx="32" cy="32" r="5" fill="#9a4130"/>
    </svg>
    <h1>الدرر البهية</h1>
    <p class="sub">Ad-Durar Al-Bahiyyah fi Al-Masa'il Al-Fiqhiyyah</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="userInput">Nama pengguna</label>
        <input id="userInput" type="text" placeholder="muslim" autocomplete="username">
      </div>
      <div class="field">
        <label for="passInput">Kata sandi</label>
        <input id="passInput" type="password" placeholder="••••••••••" autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn">Masuk</button>
      <div id="loginError"></div>
    </form>
    <div class="login-hint">
      Akun contoh &mdash; user: <b>muslim</b> &nbsp;/&nbsp; sandi: <b>addurarulbahiyyah</b>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="brand">الدرر البهية<small>Ad-Durar Al-Bahiyyah &middot; asy-Syaukani</small></div>
    <div class="spacer"></div>
    <button id="menuToggle" aria-label="Buka daftar kitab">☰</button>
  </div>

  <div class="main-row">
    <main id="content"><div class="content-inner" id="contentInner"></div></main>

    <div id="sidebarBackdrop"></div>
    <nav id="sidebar">
      <div class="sidebar-search">
        <input id="searchBooks" type="text" placeholder="Cari kitab…">
      </div>
      <ul class="book-list" id="bookList"></ul>
    </nav>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- LOGIN ----------
  var VALID_USER = "muslim";
  var VALID_PASS = "addurarulbahiyyah";

  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var u = document.getElementById("userInput").value.trim();
    var p = document.getElementById("passInput").value;
    var err = document.getElementById("loginError");
    if(u === VALID_USER && p === VALID_PASS){
      document.getElementById("loginScreen").style.display = "none";
      var app = document.getElementById("app");
      app.classList.add("active");
      initApp();
    } else {
      err.textContent = "Nama pengguna atau kata sandi salah.";
    }
  });

  // ---------- APP ----------
  var DATA = null;
  var currentBookIndex = 0;
  var initialized = false;

  function initApp(){
    if(initialized){ return; }
    initialized = true;
    fetch("data.json")
      .then(function(r){ return r.json(); })
      .then(function(json){
        DATA = json;
        renderSidebar();
        renderBook(0);
      })
      .catch(function(err){
        document.getElementById("contentInner").innerHTML =
          '<div class="empty-state"><div class="icon">⚠</div><h3>Gagal memuat data.json</h3>' +
          '<p>Pastikan file <code>data.json</code> berada di folder yang sama dengan index.html, ' +
          'dan halaman diakses lewat server (bukan dibuka langsung dari file://).</p></div>';
        console.error(err);
      });
  }

  function renderSidebar(){
    var list = document.getElementById("bookList");
    list.innerHTML = "";
    DATA.books.forEach(function(book, idx){
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.className = "book-link" + (idx === currentBookIndex ? " active" : "");
      btn.setAttribute("data-idx", idx);
      btn.innerHTML =
        '<span class="book-num">' + String(book.no).padStart(2,"0") + '</span>' +
        '<span class="book-names">' +
          '<span class="book-name-ar">' + book.title_ar + '</span>' +
          '<span class="book-name-id">' + book.title_id + '</span>' +
        '</span>';
      btn.addEventListener("click", function(){
        renderBook(idx);
        closeSidebarMobile();
      });
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  function markActiveInSidebar(idx){
    var links = document.querySelectorAll(".book-link");
    links.forEach(function(el){
      el.classList.toggle("active", parseInt(el.getAttribute("data-idx"),10) === idx);
    });
  }

  function roundelSVG(){
    return '<svg class="roundel" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="15" cy="15" r="13" fill="none" stroke="#9a4130" stroke-width="1.2"/>' +
      '<circle cx="15" cy="15" r="8.5" fill="none" stroke="#b9924f" stroke-width="1"/>' +
      '<circle cx="15" cy="15" r="2.6" fill="#9a4130"/>' +
      '</svg>';
  }

  function renderBook(idx){
    currentBookIndex = idx;
    var book = DATA.books[idx];
    markActiveInSidebar(idx);

    var html = '';
    html += '<div class="book-header">';
    html += '  <div class="book-eyebrow">Kitab ' + String(book.no).padStart(2,"0") + ' &middot; ' + (idx+1) + ' dari ' + DATA.books.length + '</div>';
    html += '  <h1 class="book-title-ar">' + book.title_ar + '</h1>';
    html += '  <p class="book-title-id">' + book.title_id + '</p>';
    html += '</div>';

    html += '<div class="player">';
    html += '  <div class="player-label"><span>🔊 Murottal &mdash; ' + book.title_id + '</span>' +
            '<a class="src-link" href="' + book.shamela_url + '" target="_blank" rel="noopener">Rujukan teks di Shamela ↗</a></div>';
    html += '  <audio controls preload="none" src="' + DATA.meta.audio_base + book.audio_file + '"></audio>';
    html += '</div>';

    if(!book.sections || book.sections.length === 0){
      html += '<div class="empty-state">';
      html += '  <div class="icon">📜</div>';
      html += '  <h3>Teks &amp; terjemahan belum diisi</h3>';
      html += '  <p>Audio kitab ini sudah tersedia di atas. Teks Arab dan terjemahan Indonesia per kalimat ' +
              'akan ditambahkan pada <code>data.json</code>, di dalam larik <code>sections</code> milik kitab ini.</p>';
      html += '</div>';
    } else {
      book.sections.forEach(function(sec){
        html += '<div class="section-block">';
        html += '  <div class="section-marker">' + roundelSVG() +
                '    <div class="section-titles">' +
                '      <div class="section-title-ar">' + (sec.title_ar || '') + '</div>' +
                (sec.title_id ? '<div class="section-title-id">' + sec.title_id + '</div>' : '') +
                '    </div>' +
                '  </div>';
        html += '  <div class="section-rule"></div>';
        (sec.paragraphs || []).forEach(function(p){
          html += '<div class="para">';
          html += '  <div class="para-ar">' + (p.ar || '') + '</div>';
          if(p.id){ html += '  <div class="para-id">' + p.id + '</div>'; }
          html += '</div>';
        });
        html += '</div>';
      });
    }

    document.getElementById("contentInner").innerHTML = html;
    document.getElementById("content").scrollTop = 0;
  }

  // ---------- SIDEBAR (mobile toggle) ----------
  var sidebar = document.getElementById("sidebar");
  var backdrop = document.getElementById("sidebarBackdrop");
  document.getElementById("menuToggle").addEventListener("click", function(){
    sidebar.classList.toggle("open");
    backdrop.classList.toggle("open");
  });
  backdrop.addEventListener("click", closeSidebarMobile);
  function closeSidebarMobile(){
    sidebar.classList.remove("open");
    backdrop.classList.remove("open");
  }

  // ---------- SEARCH ----------
  document.getElementById("searchBooks").addEventListener("input", function(e){
    var q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".book-link").forEach(function(el){
      var txt = el.textContent.toLowerCase();
      el.parentElement.style.display = txt.indexOf(q) !== -1 ? "" : "none";
    });
  });

})();
</script>
</body>
</html>
